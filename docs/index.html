<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treehole — Anonymous Emotional Wellness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f7f5f2;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .logo {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.05rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.8; }

    .btn-primary {
      background: #2c2c2c;
      color: #ffffff;
    }

    .btn-secondary {
      background: #f0ede8;
      color: #2c2c2c;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌳</div>
    <h1>Treehole</h1>
    <p class="tagline">
      A safe, anonymous space to release your feelings —<br />
      drift bottle clouds for the soul.
    </p>
    <div class="links">
      <a class="btn btn-primary" href="privacy.html">Privacy Policy</a>
      <a class="btn btn-secondary" href="https://github.com/c-square04/Treehole">GitHub</a>
    </div>
  </div>
  <footer>
    &copy; 2026 Toki Studio. All rights reserved.
  </footer>
</body>
</html>
